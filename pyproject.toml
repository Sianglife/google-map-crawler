[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "google-map-crawler"
version = "0.1.0"
description = "A Python library for collecting Google Maps place information."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["selenium>=4.54,<5"]

[dependency-groups]
dev = [
    "build>=1.2.2",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["google_map_crawler", "google_map_crawler.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
markers = ["integration: opt-in tests that start a real browser"]
